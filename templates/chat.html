<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Research Assistant — Chatbot (Full Screen)</title>
  <meta name="description" content="Full-screen research-paper chatbot — PDF only attachments."/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/chat.css') }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧠</text></svg>">
</head>
<body class="page full-screen">

  <!-- Background blobs / animated canvas (kept decorative) -->
  <div class="bg-visuals" aria-hidden="true">
    <svg class="blob blob-1" viewBox="0 0 600 600" preserveAspectRatio="xMidYMid slice">
      <defs><linearGradient id="g1" x1="0" x2="1"><stop offset="0" stop-color="#6EE7B7"/><stop offset="1" stop-color="#3B82F6"/></linearGradient></defs>
      <g transform="translate(300,300)">
        <path d="M120,-160C160,-120,190,-80,200,-30C210,20,200,70,170,120C140,170,90,210,30,230C-30,250,-90,250,-140,220C-190,190,-230,140,-230,80C-230,20,-200,-40,-160,-90C-120,-140,-60,-180,-10,-170C40,-160,80,-200,120,-160Z" fill="url(#g1)"/>
      </g>
    </svg>

    <svg class="blob blob-2" viewBox="0 0 600 600" preserveAspectRatio="xMidYMid slice">
      <defs><linearGradient id="g2" x1="0" x2="1"><stop offset="0" stop-color="#FDE68A"/><stop offset="1" stop-color="#FB7185"/></linearGradient></defs>
      <g transform="translate(300,300)">
        <path d="M85,-120C115,-85,145,-40,150,5C155,50,135,95,105,130C75,165,35,190,-15,210C-65,230,-130,235,-160,200C-190,165,-180,85,-165,35C-150,-15,-130,-50,-100,-90C-70,-130,-35,-155,5,-165C45,-175,65,-155,85,-120Z" fill="url(#g2)"/>
      </g>
    </svg>
  </div>

  <main class="chat-root" role="main" aria-label="Research assistant chat">
    <!-- Top header -->
    <header class="chat-header" role="banner">
      <div class="brand">
        <div class="avatar" aria-hidden="true">
          <svg viewBox="0 0 64 64" width="36" height="36" role="img" aria-hidden="true">
            <circle cx="32" cy="32" r="30" fill="#0EA5E9"/>
            <text x="50%" y="55%" text-anchor="middle" font-size="28" fill="#fff" font-family="Inter, sans-serif">R</text>
          </svg>
        </div>
        <div class="brand-info">
          <strong>ChatBot</strong>
          <span class="status">Ready — upload a PDF or ask a question</span>
        </div>
      </div>

      <div class="header-actions">
        <button id="close-btn" class="icon-btn" title="Close chat" aria-label="Close">✕</button>
      </div>
      <!-- Account Button -->
    <div class="account-menu">
        <button id="account-btn" class="account-button">
            <span id="user-name-display">Account</span>
            <i>▼</i>
        </button>

        <div id="account-dropdown" class="account-dropdown hidden">
            <p id="user-display-name">User Name</p>
            <p id="user-email">example@gmail.com</p>
            <button id="logout-btn">Logout</button>
        </div>
    </div>

    </header>

    <!-- Messages area -->
    <section id="messages" class="messages" aria-live="polite" tabindex="0">
      <div class="message bot welcome">
        <div class="meta"><span class="sender">AI</span> · <time>just now</time></div>
        <div class="bubble">Hi — upload a PDF or ask a question to get started.</div>
      </div>
    </section>

    <!-- Composer -->
    <form id="composer" class="composer" autocomplete="off" aria-label="Send a message">
      <div class="composer-left">
        <!-- Attach button: triggers hidden file input; only PDF allowed via accept attr -->
        <input id="file-input" type="file" accept="application/pdf" aria-hidden="true" style="display:none">
        <button id="attach-btn" class="tool-btn" type="button" title="Attach PDF" aria-label="Attach PDF">📎</button>

        <label for="input" class="visually-hidden">Message</label>
        <input id="input" name="input" class="input" type="text"
               placeholder="Ask about methods, results, or request summaries..." aria-label="Type your message"/>
      </div>

      <div class="composer-right">
        <button id="send-btn" class="btn btn-send" type="submit" aria-label="Send message">Send ↵</button>
      </div>
    </form>
  </main>

  <!-- Firebase App (the core Firebase SDK) is always required and must be listed first -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-analytics.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>


  <script src="{{ url_for('static', filename='js/chat.js') }}"></script>
  <script src="{{ url_for('static', filename='js/firebase.js') }}"></script>

  <style>
    .visually-hidden { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  </style>
</body>
</html>
